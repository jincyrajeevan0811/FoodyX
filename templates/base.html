{% load static %}<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}{{ site_name }}{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}{% if platform.seo_description %}{{ platform.seo_description }}{% else %}{{ site_name }} — the modern restaurant management system: POS, KOT, QR ordering, delivery, inventory and reports.{% endif %}{% endblock %}">
  <meta name="theme-color" content="#4f46e5">
  {% if platform.google_site_verification %}<meta name="google-site-verification" content="{{ platform.google_site_verification }}">{% endif %}
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%234f46e5'/%3E%3Cstop offset='1' stop-color='%237c3aed'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Cpath d='M24 46V30m0 0v-12m0 12h12M40 18v28' stroke='white' stroke-width='5' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/foodyx.css' %}">
  <script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("fx-theme")||"light")}catch(e){}</script>
  {% block extra_head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  {% include "partials/messages.html" %}
  {% block body %}{% endblock %}
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="{% static 'js/foodyx.js' %}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
